<!doctype html>
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="../../bundle.css">
        <title>buildrone</title>
    </head>
    <body>
        <div class="modal" id="loginModal">
            <form action="#" method="POST" id="loginForm" class="card relative mx-auto my-[10%] w-11/12 sm:w-4/5 lg:w-1/3 flex flex-col gap-4">
                <h5 class="heading">login to buildrone</h5>
                <input class="field ~neutral w-full" type="text" id="username" placeholder="Username">

                <input class="field ~neutral w-full" type="password" id="password" placeholder="Password">
                
                <div class="flex flex-row justify-end gap-2">
                    <button type="submit" class="button ~neutral @high submit" id="loginButton" form="loginForm">Login</button>
                </div>
            </form>
        </div>
        <div class="modal" id="secretWarningModal">
            <div class="card relative mx-auto my-[10%] w-11/12 sm:w-4/5 lg:w-1/3 flex flex-col gap-4">
                <h5 class="heading">are you sure?<span class="modal-close">&times;</span></h5>
                <p class="content">Regenerating the secret will invalidate all previously generated build keys.</p>
                <div class="flex flex-row justify-end gap-2">
                    <button class="button ~neutral @high" aria-label="Cancel" id="secret-warning-close">Cancel</button>
                    <button class="button ~critical @high" id="secret-warning-submit">Continue</button>
                </div>
            </div>
        </div>

        <div class="page-container m-2 md:my-8 md:mx-16 lg:mx-32 xl:my-20 xl:mx-64 flex flex-col gap-4">
            <header class="flex flex-row justify-between">
                <h3 class="heading">dashboard</h3>
                <a class="heading text-neutral-400 hover:underline" href="https://github.com/hrfee/buildrone">buildrone</a>
            </header>
            <div class="w-full flex flex-col gap-4" id="repos">
            </div>
        </div>
    </body>
    <script src="../../admin.js"></script>
</html>
